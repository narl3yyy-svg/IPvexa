<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101417">
<title>IPvexa</title>
<style>
  :root {
    --bg: #101417; --scene: #0a0d0f; --panel: #192024; --panel2: #212a2f; --raised: #2a343a;
    --border: #263036; --text: #e3e8eb; --dim: #98a6ae; --faint: #5e6c74;
    --accent: #2fa8e0; --online: #2fbf71; --live: #ff4757; --warn: #f5a524;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { background: var(--raised); border: 1px solid #36434a; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; border-color: transparent; color: var(--dim); }
  button:disabled { opacity: .45; }
  input { background: #0e1215; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; width: 100%; }
  input:focus { outline: none; border-color: var(--accent); }
  .hidden { display: none !important; }

  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
           padding-top: max(10px, env(safe-area-inset-top)); background: #12171a; border-bottom: 1px solid var(--border); }
  .logo { width: 24px; height: 24px; border-radius: 6px; background: linear-gradient(#46b8ec, #1d74b8); position: relative; flex: none; }
  .logo::after { content: ""; position: absolute; inset: 6px; border: 2px solid #fff; border-radius: 50%; }
  .brand { font-weight: 700; font-size: 16px; letter-spacing: .3px; }
  header .spacer { flex: 1; }
  header .user { color: var(--dim); font-size: 13px; }

  /* Login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 26px; }
  .card h1 { margin: 0 0 2px; font-size: 22px; }
  .card .sub { color: var(--dim); margin-bottom: 20px; font-size: 13px; }
  .card label { display: block; color: var(--dim); font-size: 12px; margin: 12px 0 6px; }
  .card button { width: 100%; margin-top: 18px; padding: 11px; }
  .err { color: #ff8a93; font-size: 13px; margin-top: 10px; min-height: 1em; }

  /* Grid */
  #grid { display: grid; gap: 8px; padding: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .tile { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; cursor: pointer; border: 1px solid var(--border); }
  .tile img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile .name { position: absolute; left: 0; right: 0; top: 0; padding: 8px 10px 16px; font-weight: 600; font-size: 13px;
                background: linear-gradient(#000c, #0000); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--online); } .dot.off { background: var(--live); }
  .badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: #e5484dcc; }
  .tile .msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 13px; }

  /* Single camera */
  #view { padding: 0 0 20px; }
  .player { position: relative; background: #000; aspect-ratio: 16/9; max-height: 70vh; width: 100%; }
  .player img, .player video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  /* A new connection loads out of sight and replaces the shown one once it plays. */
  .player .incoming { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 8px 12px; color: var(--dim); }
  .seg button.on { background: #153a4d; color: var(--accent); }
  .player .stamp { position: absolute; left: 10px; bottom: 10px; font: 600 12px ui-monospace, monospace; padding: 3px 8px; border-radius: 4px; background: #000a; }
  .player .stamp.live { color: #ff6b77; }
  .player .stamp.rec { color: #cfe3ff; background: #0f2a4dcc; }
  .controls { padding: 6px 10px 8px; border-bottom: 1px solid var(--border); }
  .controls .row { display: flex; align-items: center; gap: 4px; }
  .controls .transport { justify-content: center; gap: 6px; margin-bottom: 6px; }
  .controls button { padding: 6px 10px; background: transparent; border-color: transparent; color: var(--dim); font-weight: 600; }
  .controls .row:last-child > button { border-color: var(--border); padding: 4px 10px; font-size: 13px; }
  .controls button.on { background: #153a4d; color: var(--accent); border-color: #1f5f86; }
  .controls #playBtn { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border-color: var(--accent); color: #fff; font-size: 16px; padding: 0; }
  .grow { flex: 1; }
  .selbar { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 4px 6px 4px 10px; background: #1f3a52; border: 1px solid #2f6aa0; border-radius: 8px; color: #cfe6ff; font-size: 13px; }
  .selbar span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .selbar button { padding: 4px 12px; font-size: 13px; }
  .selbar #selSave { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .selbar #selClr { background: transparent; border-color: transparent; color: var(--dim); }
  .spansel { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; font: inherit; font-size: 13px; }
  .tlwrap { position: relative; padding: 0 10px 2px; }
  .tlhead { display: flex; align-items: center; gap: 10px; padding: 8px 0 6px; }
  .datebtn { display: flex; align-items: center; gap: 10px; background: transparent; border-color: transparent; padding: 3px 8px; white-space: nowrap; min-width: 0; }
  .datebtn:hover { border-color: var(--border); }
  .datebtn .clock { font: 600 21px ui-monospace, monospace; color: var(--text); }
  .datebtn.rec .clock { color: #9cc8ff; }
  .datebtn .day { font-size: 13px; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; overflow: hidden; text-overflow: ellipsis; }
  .tlhead .live-btn { white-space: nowrap; flex: none; }
  #tl { display: block; width: 100%; height: 66px; border-radius: 6px; touch-action: none; cursor: pointer; }
  #strip { position: relative; height: 8px; margin-top: 5px; border-radius: 4px; background: #151a20; touch-action: none; cursor: pointer; }
  #strip .mid { position: absolute; top: 0; bottom: 0; width: 1px; background: #2b313c; }
  #thumb { position: absolute; top: 0; height: 8px; border-radius: 4px; background: #56607a; min-width: 14px; }
  .live-btn { color: var(--live); border-color: var(--live); font-weight: 700; padding: 5px 12px; }
  .live-btn.on { background: var(--live); color: #fff; }
  h3 { margin: 14px 12px 8px; font-size: 13px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .8px; }
  .events { list-style: none; margin: 0; padding: 0 10px; display: grid; gap: 6px; }
  .events li { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 6px; cursor: pointer; }
  .events img { width: 96px; height: 54px; object-fit: cover; border-radius: 6px; background: #0b0e10; flex: none; }
  .events .t { font-weight: 600; font-size: 13px; } .events .d { color: var(--dim); font-size: 12px; }
  .events .k { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; margin-right: 6px; }
  .k.motion { background: #e5484d; } .k.bookmark { background: var(--warn); color: #000; }
  .cliphead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 14px 10px 8px; }
  .cliphead h3 { margin: 0; }
  .cliphead .n { color: var(--faint); font-size: 12px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cliphead .seg button { padding: 4px 10px; font-size: 12px; }
  .events li.cur { border-color: var(--accent); background: #12293a; }
  .events li.cur .t { color: #9cc8ff; }
  .empty { color: var(--faint); padding: 10px 14px; font-size: 13px; }

  /* Calendar: days with recordings are marked (red: motion) and only they can be picked. */
  .cal { position: absolute; bottom: calc(100% - 6px); left: 10px; z-index: 10; width: 284px; max-width: calc(100% - 20px); background: var(--panel); border: 1px solid #36434a;
         border-radius: 10px; padding: 12px; box-shadow: 0 10px 30px #0008; }
  .cal .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .cal .hd b { flex: 1; text-align: center; font-size: 14px; }
  .cal .hd button { padding: 4px 10px; background: transparent; }
  .cal .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
  .cal .dow { font-size: 11px; color: var(--faint); padding-bottom: 2px; }
  .cal .day { position: relative; height: 32px; border-radius: 6px; font-size: 13px; color: var(--faint); border: 1px solid transparent; padding: 0; background: transparent; }
  .cal .day:disabled { opacity: 1; cursor: default; }
  .cal .day.rec { color: var(--text); font-weight: 600; background: var(--panel2); cursor: pointer; }
  .cal .day.rec:hover { background: var(--raised); }
  .cal .day.rec::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 14px; height: 3px; margin-left: -7px; border-radius: 2px; background: var(--accent); }
  .cal .day.motion::after { background: #e5484d; }
  .cal .day.today { border-color: var(--accent); }
  .cal .day.sel { background: var(--accent); color: #fff; }
  .cal .day.sel::after { background: #fff; }
  .cal .note { color: var(--faint); font-size: 11px; text-align: center; margin: 8px 0; min-height: 1em; }
  .cal .today-btn { width: 100%; }

  /* Full screen: only the video, nothing else. Names show while the pointer is over a camera. */
  body.fs header, body.fs .controls, body.fs .tlwrap, body.fs h3, body.fs .events { display: none !important; }
  body.fs, body.fs #app { background: #000; }
  body.fs #grid { height: 100vh; height: 100dvh; padding: 0; gap: 2px;
                  grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr); }
  body.fs .tile { aspect-ratio: auto; border: 0; border-radius: 0; min-height: 0; }
  body.fs .tile .name, body.fs .player .stamp { opacity: 0; transition: opacity .15s; }
  body.fs .tile:hover .name, body.fs .player:hover .stamp { opacity: 1; }
  body.fs #view { padding: 0; }
  body.fs .player { height: 100vh; height: 100dvh; max-height: none; aspect-ratio: auto; }
  #fsExit { position: fixed; top: 12px; right: 12px; z-index: 20; background: #000b; border-color: #fff3; color: #fff;
            opacity: 0; pointer-events: none; transition: opacity .2s; }
  body.fs #fsExit.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="card" id="loginForm">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px"><div class="logo" style="width:36px;height:36px;border-radius:9px"></div>
      <div><h1>IPvexa</h1><div class="sub" style="margin:0">Video Management System</div></div></div>
    <label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none" required>
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <button class="ghost hidden" id="back" aria-label="Back">‹ Back</button>
    <div class="logo"></div><div class="brand" id="title">IPvexa</div>
    <div class="spacer"></div>
    <span class="user" id="who"></span>
    <button class="ghost" id="fs" title="Full screen: show only the cameras">⛶ Full screen</button>
    <button class="ghost" id="logout">Sign out</button>
  </header>
  <button id="fsExit" class="hidden">✕ Exit full screen</button>
  <main id="grid"></main>
  <main id="view" class="hidden">
    <div class="player"><img id="stream" alt=""><video id="video" class="hidden" muted playsinline autoplay></video><div class="stamp live" id="stamp">LIVE</div></div>
    <div class="tlwrap" id="tlwrap">
      <div class="tlhead">
        <button class="datebtn" id="dateBtn" title="Go to a day with recordings"><span class="clock" id="clockTxt"></span><span class="day">&#128197; <span id="dateTxt"></span></span></button>
        <span class="grow"></span>
        <button class="live-btn on" id="liveBtn" title="Back to live video">● LIVE</button>
      </div>
      <canvas id="tl" aria-label="Timeline: tap to play from a moment, drag to move, pinch or scroll to zoom"></canvas>
      <div id="strip" title="Drag to move along the timeline"><div id="thumb"></div></div>
      <div class="selbar hidden" id="selBar"><span id="selTxt"></span><button id="selSave">Save video</button><button id="selClr" aria-label="Clear selection">✕</button></div>
      <div class="cal hidden" id="cal"></div>
    </div>
    <div class="controls">
      <div class="row transport">
        <button id="prevEv" title="Previous motion or bookmark" aria-label="Previous motion or bookmark">⏮</button>
        <button id="back30" title="Back 30 seconds">−30</button>
        <button id="playBtn" title="Play / pause" aria-label="Play or pause">❚❚</button>
        <button id="fwd30" title="Forward 30 seconds">+30</button>
        <button id="nextEv" title="Next motion or bookmark" aria-label="Next motion or bookmark">⏭</button>
      </div>
      <div class="row">
        <button id="speedBtn" title="Playback speed: tap for faster">1×</button>
        <button id="selBtn" title="Select part of the timeline to save: drag on the timeline (or Shift+drag with a mouse)">Select</button>
        <span class="grow"></span>
        <button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
        <select id="spanSel" class="spansel" title="Show 1 hour, 1 day, 1 week, or the whole day" aria-label="Timeline length"><option value="" hidden>2h</option><option value="3600000">1 hour</option><option value="86400000">1 day</option><option value="604800000">1 week</option><option value="day">Whole day</option></select>
        <button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
        <span class="grow"></span>
        <span class="seg" title="Picture quality"><button id="qSD" class="on">SD</button><button id="qHD">HD</button></span>
      </div>
    </div>
    <div class="cliphead"><h3>Motion</h3><span class="n" id="clipInfo"></span>
      <span class="seg" id="clipKind"><button data-k="all" class="on">All</button><button data-k="person">People</button><button data-k="vehicle">Vehicles</button></span></div>
    <ul class="events" id="events"></ul>
  </main>
</section>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const S = { token: localStorage.getItem("ipvexa_token") || "", me: null, cams: [], cam: null, playFrom: 0, playStartedAt: 0, perms: {},
            speed: 1, paused: false, pausedAt: 0,
            hd: localStorage.getItem("ipvexa_hd") === "1" };

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", ...(S.token ? { Authorization: "Bearer " + S.token } : {}) } });
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (res.status === 401 && path !== "/api/login") { signedOut(); throw new Error("Please sign in again"); }
  if (!res.ok) throw new Error((body && body.error) || res.statusText);
  return body;
}
const withToken = (url) => url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(S.token);
const fmt = (ms, withDate) => new Date(ms).toLocaleString([], withDate ? { weekday: "short", hour: "2-digit", minute: "2-digit", second: "2-digit" } : { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function signedOut() {
  S.token = ""; localStorage.removeItem("ipvexa_token");
  stopStreams();
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginErr").textContent = ""; $("loginBtn").disabled = true;
  try {
    const r = await api("/api/login", { method: "POST", body: JSON.stringify({ username: $("u").value, password: $("p").value }) });
    S.token = r.token; localStorage.setItem("ipvexa_token", r.token);
    $("p").value = "";
    await start();
  } catch (err) { $("loginErr").textContent = err.message; }
  finally { $("loginBtn").disabled = false; }
});
$("logout").onclick = async () => { if (!confirm("Sign out of IPvexa?")) return; try { await api("/api/logout", { method: "POST" }); } catch (e) {} signedOut(); };

async function start() {
  S.me = await api("/api/me");
  S.perms = S.me.permissions || {};
  $("who").textContent = S.me.full_name || S.me.username;
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  await loadCams();
  route();
}

async function loadCams() { S.cams = await api("/api/cameras"); }

// ---------- Grid: snapshots refreshed every few seconds (light on phones and VPNs) ----------
let gridTimer = 0;
function showGrid() {
  stopStreams();
  S.cam = null;
  $("view").classList.add("hidden"); $("grid").classList.remove("hidden"); $("back").classList.add("hidden");
  $("title").textContent = "IPvexa";
  const g = $("grid");
  if (!S.cams.length) { g.innerHTML = '<div class="empty">No cameras you can view.</div>'; return; }
  g.innerHTML = S.cams.map((c) => {
    const st = c.status && c.status.main ? c.status.main.state : "offline";
    return `<div class="tile" data-id="${c.id}"><img alt="" data-id="${c.id}"><div class="msg">${c.enabled ? "Loading…" : "Disabled"}</div>
      <div class="name"><span class="dot ${st === "online" ? "on" : "off"}"></span>${esc(c.name)}${c.status && c.status.motion ? '<span class="badge">MOTION</span>' : ""}</div></div>`;
  }).join("");
  // In full screen the cameras fill the screen in a near-square grid.
  const cols = Math.ceil(Math.sqrt(S.cams.length));
  g.style.setProperty("--cols", cols);
  g.style.setProperty("--rows", Math.ceil(S.cams.length / cols));
  g.querySelectorAll(".tile").forEach((t) => (t.onclick = () => { location.hash = "camera=" + t.dataset.id; }));
  const refresh = async () => {
    try { await loadCams(); } catch (e) { return; }
    g.querySelectorAll("img[data-id]").forEach((img) => {
      const c = S.cams.find((x) => x.id == img.dataset.id);
      if (!c || !c.enabled) return;
      const next = new Image();
      next.onload = () => { img.src = next.src; img.nextElementSibling.classList.add("hidden"); };
      next.onerror = () => { img.nextElementSibling.textContent = "No picture"; };
      next.src = withToken(`/api/cameras/${c.id}/snapshot?r=${Date.now()}`);
      const dot = img.parentElement.querySelector(".dot");
      const st = c.status && c.status.main ? c.status.main.state : "offline";
      dot.className = "dot " + (st === "online" ? "on" : "off");
    });
  };
  refresh();
  gridTimer = setInterval(refresh, 4000);
}

// ---------- Single camera: native video (fMP4) or MJPEG, live or playback ----------
// A stream is one long HTTP response. Anything that ends it (the camera
// reconnecting, a Wi-Fi drop, the server dropping a viewer that fell behind) would
// leave the last picture frozen, so a watchdog notices within seconds and
// reconnects, and live video also gets a fresh connection every 30 minutes. A new
// connection loads out of sight and replaces the shown one once it plays: no gap.
let clockTimer = 0, watchTimer = 0, playGen = 0;
const REFRESH_MS = 30 * 60000, STALL_MS = 6000, CONNECT_MS = 15000;

function closeMedia(el) {
  if (!el) return;
  el.onload = el.onerror = el.onplaying = el.onended = null;
  if (el.tagName === "VIDEO") { el.pause(); el.removeAttribute("src"); el.load(); }
  else el.removeAttribute("src"); // closes the connection
}
function stopStreams() {
  clearInterval(gridTimer); gridTimer = 0;
  clearInterval(clockTimer); clockTimer = 0;
  clearInterval(watchTimer); watchTimer = 0;
  if (!S.cam) { clearInterval(TL.drawTimer); TL.drawTimer = 0; }
  playGen++; // cancels pending retries of the previous stream
  closeMedia($("stream")); closeMedia($("video"));
  document.querySelectorAll(".player .incoming").forEach((el) => { closeMedia(el); el.remove(); });
}

// Can this browser play the camera's stream natively (full frame rate)? If not, MJPEG.
function nativeVideo(stream) {
  const st = S.cam && S.cam.status ? S.cam.status[stream] || S.cam.status.main : null;
  const codec = st && st.codec;
  const v = $("video");
  if (codec === "h264") return v.canPlayType('video/mp4; codecs="avc1.640028"') !== "";
  if (codec === "hevc") return v.canPlayType('video/mp4; codecs="hvc1.1.6.L150.B0"') !== "";
  return false;
}

function showCamera(id, t) {
  const c = S.cams.find((x) => x.id == id);
  if (!c) { location.hash = ""; return; }
  stopStreams();
  S.cam = c;
  $("qHD").classList.toggle("on", S.hd); $("qSD").classList.toggle("on", !S.hd);
  $("grid").classList.add("hidden"); $("view").classList.remove("hidden"); $("back").classList.remove("hidden");
  $("title").textContent = c.name;
  const canPlay = S.me.role === "admin" || S.perms.playback;
  $("tl").classList.toggle("hidden", !canPlay); $("strip").classList.toggle("hidden", !canPlay); $("dateBtn").disabled = !canPlay;
  ["prevEv", "nextEv", "back30", "fwd30", "playBtn", "speedBtn", "zoomOut", "zoomIn", "spanSel"].forEach((x) => $(x).classList.toggle("hidden", !canPlay));
  $("selBtn").classList.toggle("hidden", !canPlay || !(S.me.role === "admin" || S.perms.export));
  TL.sel = null; TL.selMode = false; selUpdate();
  S.speed = 1; S.paused = false; updateSpeed();
  TL.chunks = []; TL.events = []; TL.follow = true;
  tlShow(t || Date.now());
  play(t || 0);
  CL.sig = null; renderClips();
}

// A short fingerprint of what an <img> shows (a 32×18 copy's pixels).
const sigCanvas = document.createElement("canvas");
sigCanvas.width = 32; sigCanvas.height = 18;

async function tlFetch() {

function tlDraw() {

  for (const ev of TL.events) {

  $("thumb").style.width = (span / len) * 100 + "%";

  for (let d = addDays(TL.rangeStart, 1), n = 0; d < TL.rangeEnd && n < 60; d = addDays(d, 1), n++) {

      const t = Math.round(timeAt(Math.max(r.left, Math.min(r.right, e.clientX))));
      if (sel === "new") TL.sel = { a: Math.min(anchor, t), b: Math.max(anchor, t) };
      else if (sel === "a") TL.sel = t < TL.sel.b ? { a: t, b: TL.sel.b } : (sel = "b", { a: TL.sel.b, b: t });
      else TL.sel = t > TL.sel.a ? { a: TL.sel.a, b: t } : (sel = "a", { a: t, b: TL.sel.a });
      selUpdate(); tlDraw();
      return;
    }
    if (moved && !pinch) {
      const span = TL.end - TL.start;
      TL.follow = false;
      TL.start = downStart - ((e.clientX - downX) / r.width) * span; TL.end = TL.start + span;
      tlChanged();
    }
  });
  const up = (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size > 0) return;
    const wasPinch = !!pinch; pinch = null;
    if (sel && moved) {
      sel = "";
      if (TL.sel && TL.sel.b - TL.sel.a < 1000) TL.sel = null;
      else { TL.selMode = false; }
      selUpdate(); tlDraw();
      return;
    }
    sel = "";
    if (moved || wasPinch || e.type === "pointercancel") return;
    const r = cv.getBoundingClientRect(), t = Math.round(timeAt(e.clientX));
    // A second tap soon after zooms in there instead of playing.
    if (Date.now() - lastTap < 300) { clearTimeout(tapTimer); lastTap = 0; tlZoomTo((TL.end - TL.start) * 0.4, t, (e.clientX - r.left) / r.width); return; }
    lastTap = Date.now();
    tapTimer = setTimeout(() => playAt(t), 300);
  };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    tlZoomTo((TL.end - TL.start) * Math.pow(1.25, e.deltaY / 100), timeAt(e.clientX), (e.clientX - r.left) / r.width);
  }, { passive: false });
  window.addEventListener("resize", () => tlDraw());
})();

// ---------- Selection: save part of the timeline as a video ----------
function fmtLen(ms) {
  let s = Math.round(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  s %= 60;
  return h ? `${h} h ${m} min` : m ? `${m} min${s ? " " + s + " s" : ""}` : `${s} s`;
}
function selUpdate() {
  $("selBtn").classList.toggle("on", !!TL.selMode);
  $("selBtn").textContent = TL.selMode ? "Drag on the timeline" : "Select";
  const has = !!TL.sel;
  $("selBar").classList.toggle("hidden", !has);
  if (!has) return;
  const len = TL.sel.b - TL.sel.a, hm = { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false };
  $("selTxt").textContent = `${new Date(TL.sel.a).toLocaleTimeString([], hm)} – ${new Date(TL.sel.b).toLocaleTimeString([], hm)} · ${fmtLen(len)}`;
  $("selSave").disabled = len > 2 * 3600000;
  $("selSave").title = len > 2 * 3600000 ? "Select 2 hours or less" : "Save this part of " + S.cam.name + " (original quality)";
}
$("selBtn").onclick = () => { TL.selMode = !TL.selMode; selUpdate(); };
$("selClr").onclick = () => { TL.sel = null; TL.selMode = false; selUpdate(); tlDraw(); };
$("selSave").onclick = () => {
  if (!TL.sel || !S.cam) return;
  const a = document.createElement("a");
  a.href = withToken(`/api/cameras/${S.cam.id}/export?from=${TL.sel.a}&to=${TL.sel.b}&stream=main`);
  a.download = "";
  document.body.appendChild(a); a.click(); a.remove();
};

// ---------- Calendar: only days with recordings can be picked ----------
const CAL = { year: 0, month: 0, days: null, gen: 0 };
function calOpen() {
  const p = new Date(position());
  CAL.year = p.getFullYear(); CAL.month = p.getMonth();
  $("cal").classList.remove("hidden");
  calLoad();
}
function calClose() { $("cal").classList.add("hidden"); }
$("dateBtn").onclick = () => ($("cal").classList.contains("hidden") ? calOpen() : calClose());
document.addEventListener("pointerdown", (e) => { if (!$("cal").contains(e.target) && !$("dateBtn").contains(e.target)) calClose(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") calClose(); });
async function calLoad() {
  const gen = ++CAL.gen;
  CAL.days = null; calRender();
  const n = new Date(CAL.year, CAL.month + 1, 0).getDate(), b = [];
  for (let d = 1; d <= n + 1; d++) b.push(new Date(CAL.year, CAL.month, d).getTime());
  try {
    const r = await api(`/api/cameras/${S.cam.id}/days?bounds=${b.join(",")}`);
    if (gen === CAL.gen) { CAL.days = r.days || []; calRender(); }
  } catch (e) { if (gen === CAL.gen) { CAL.days = []; calRender(e.message); } }
}
function calRender(err) {
  const first = new Date(CAL.year, CAL.month, 1), n = new Date(CAL.year, CAL.month + 1, 0).getDate();
  const sel = startOfDay(position()), today = startOfDay(Date.now());
  const canNext = new Date(CAL.year, CAL.month + 1, 1) <= new Date();
  let h = `<div class="hd"><button id="calPrev" aria-label="Previous month">‹</button><b>${first.toLocaleDateString([], { month: "long", year: "numeric" })}</b>`
        + `<button id="calNext" aria-label="Next month" ${canNext ? "" : "disabled"}>›</button></div><div class="grid">`;
  for (let i = 0; i < 7; i++) h += `<div class="dow">${new Date(2024, 0, 7 + i).toLocaleDateString([], { weekday: "short" }).slice(0, 2)}</div>`;
  for (let i = 0; i < first.getDay(); i++) h += "<div></div>";
  for (let d = 1; d <= n; d++) {
    const t = new Date(CAL.year, CAL.month, d).getTime(), info = CAL.days && CAL.days[d - 1];
    const rec = !!(info && info.rec_ms > 0);
    const cls = ["day", rec ? "rec" : "", rec && info.motion > 0 ? "motion" : "", t === today ? "today" : "", t === sel ? "sel" : ""].join(" ");
    const tip = rec ? `${Math.round(info.rec_ms / 360000) / 10} h recorded${info.motion ? " · " + info.motion + " motion" : ""}` : "No recordings";
    h += `<button class="${cls}" data-d="${d}" title="${tip}" ${rec ? "" : "disabled"}>${d}</button>`;
  }
  const any = CAL.days && CAL.days.some((x) => x.rec_ms > 0);
  h += `</div><div class="note">${err ? esc(err) : !CAL.days ? "Loading…" : any ? "Days with recordings are marked. Red: motion." : "No recordings this month."}</div>`
     + `<button class="today-btn" id="calToday">Today</button>`;
  $("cal").innerHTML = h;
  $("calPrev").onclick = () => { CAL.month--; if (CAL.month < 0) { CAL.month = 11; CAL.year--; } calLoad(); };
  $("calNext").onclick = () => { CAL.month++; if (CAL.month > 11) { CAL.month = 0; CAL.year++; } calLoad(); };
  $("calToday").onclick = () => { calClose(); const d = startOfDay(Date.now()); tlZoomTo(addDays(d, 1) - d, d, 0); goLive(); };
  $("cal").querySelectorAll(".day.rec").forEach((el) => (el.onclick = () => {
    const info = CAL.days[+el.dataset.d - 1], d = new Date(CAL.year, CAL.month, +el.dataset.d).getTime();
    calClose();
    tlZoomTo(addDays(d, 1) - d, d, 0);
    TL.follow = true;
    play(info.first || d);
  }));
}

// ---------- Motion clips: every motion clip in the part of the timeline on screen ----------
const CL = { kind: "all", sig: null, list: [] };
const VEHICLES = ["car", "truck", "bus", "motorcycle", "bicycle", "train", "boat"];
function clipBadge(objects) {
  const o = (objects || "").split(",");
  if (o.includes("person")) return "PERSON";
  if (o.some((x) => VEHICLES.includes(x))) return "VEHICLE";
  return o[0] ? "ANIMAL" : "MOTION";
}
function fmtRange(a, b) {
  const da = new Date(a), db = new Date(b), hm = { hour: "2-digit", minute: "2-digit", hour12: false };
  if (da.toDateString() === db.toDateString())
    return da.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" }) + " " + da.toLocaleTimeString([], hm) + " – " + db.toLocaleTimeString([], hm);
  const dm = { day: "numeric", month: "short" };
  return da.toLocaleDateString([], dm) + " " + da.toLocaleTimeString([], hm) + " – " + db.toLocaleDateString([], dm) + " " + db.toLocaleTimeString([], hm);
}
function renderClips() {
  const ul = $("events");
  const canPlay = S.me.role === "admin" || S.perms.playback;
  const span = TL.end - TL.start, tooWide = span > 3 * DAY;
  let list = [];
  if (canPlay && !tooWide) {
    list = TL.events.filter((e) => e.kind === "motion" && e.start >= TL.start && e.start < TL.end
      && (CL.kind === "all" || (CL.kind === "person" ? (e.objects || "").split(",").includes("person") : (e.objects || "").split(",").some((x) => VEHICLES.includes(x)))))
      .sort((a, b) => a.start - b.start);
  }
  $("clipInfo").textContent = canPlay ? (tooWide ? "" : list.length + (list.length === 1 ? " clip · " : " clips · ")) + fmtRange(TL.start, TL.end) : "";
  // Rebuild only when the clips change, so thumbnails and scrolling stay put.
  const sig = [canPlay, tooWide, CL.kind, list.map((e) => e.id + ":" + e.end).join(",")].join("|");
  if (sig === CL.sig) return;
  CL.sig = sig; CL.list = list;
  if (!canPlay) { ul.innerHTML = '<li class="empty">Your account can\'t view recordings.</li>'; return; }
  if (tooWide) { ul.innerHTML = '<div class="empty">Zoom the timeline in to 3 days or less to list motion clips.</div>'; return; }
  if (!list.length) {
    const what = CL.kind === "person" ? "No people" : CL.kind === "vehicle" ? "No vehicles" : "No motion";
    ul.innerHTML = `<div class="empty">${what} in this part of the timeline. The list follows the timeline: zoom out or drag it to see more.</div>`;
    return;
  }
  const long = span > DAY;
  ul.innerHTML = list.map((e) => `<li data-t="${e.start}" data-e="${e.end || 0}">
      <img loading="lazy" alt="" src="${withToken(`/api/events/${e.id}/thumb?w=192`)}">
      <div><div class="t"><span class="k motion">${clipBadge(e.objects)}</span>${long ? fmt(e.start, true) : new Date(e.start).toLocaleTimeString([], { hour12: false })}</div>
      <div class="d">${e.end ? Math.max(1, Math.round((e.end - e.start) / 1000)) + " s" : "now"}${e.objects ? " · " + esc(e.objects.split(",").join(", ")) : ""}</div></div></li>`).join("");
  ul.querySelectorAll("li[data-t]").forEach((li) => (li.onclick = () => {
    TL.follow = true;
    playAt(+li.dataset.t - 2000);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }));
  markClip(position());
}
// Outline the clip the playhead is in.
function markClip(p) {
  $("events").querySelectorAll("li[data-t]").forEach((li) => {
    const a = +li.dataset.t, b = +li.dataset.e || Date.now();
    li.classList.toggle("cur", p >= a - 2000 && p <= b);
  });
}
$("clipKind").querySelectorAll("button").forEach((b) => (b.onclick = () => {
  CL.kind = b.dataset.k;
  $("clipKind").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  renderClips();
}));

// ---------- Routing: #camera=<id>&t=<ms> (used by phone notifications) ----------
function route() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("camera")) showCamera(+h.get("camera"), +(h.get("t") || 0));
  else showGrid();
}
window.addEventListener("hashchange", () => { if (S.token && S.me) route(); });
$("back").onclick = () => { location.hash = ""; };

// ---------- Full screen ----------
// Hides everything but the video. Uses the browser's full screen where it exists
// (not on iPhone, where the page just drops its controls). Esc or the button that
// appears when the pointer moves leaves it.
let fsHideTimer = 0;
function setFullscreen(on) {
  document.body.classList.toggle("fs", on);
  $("fsExit").classList.toggle("hidden", !on);
  const el = document.documentElement;
  if (on && !document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (on && el.webkitRequestFullscreen && !document.webkitFullscreenElement) el.webkitRequestFullscreen();
  if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (!on && document.webkitFullscreenElement) document.webkitExitFullscreen();
}
$("fs").onclick = () => setFullscreen(true);
$("fsExit").onclick = (e) => { e.stopPropagation(); setFullscreen(false); };
const fsChanged = () => { if (!document.fullscreenElement && !document.webkitFullscreenElement && document.body.classList.contains("fs")) setFullscreen(false); };
document.addEventListener("fullscreenchange", fsChanged);
document.addEventListener("webkitfullscreenchange", fsChanged);
const fsPoke = () => {
  if (!document.body.classList.contains("fs")) return;
  $("fsExit").classList.add("show");
  clearTimeout(fsHideTimer);
  fsHideTimer = setTimeout(() => $("fsExit").classList.remove("show"), 2500);
};
document.addEventListener("mousemove", fsPoke);
document.addEventListener("touchstart", fsPoke, { passive: true });
document.addEventListener("visibilitychange", () => {
  // Don't stream in the background (saves battery and data).
  if (document.hidden) stopStreams(); else if (S.me) route();
});

if (S.token) start().catch(() => signedOut()); else signedOut();
</script>
</body>
